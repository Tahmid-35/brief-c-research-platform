name: Validate and Deploy Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile app/index.py

  deploy:
    name: Deploy Lambda to AWS
    needs: test
    runs-on: ubuntu-latest
    environment: lambda-deployment
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Package Lambda code
        run: |
          test -f app/index.py
          cd app
          zip -q -j ../lambda-package.zip index.py

      - name: Deploy Lambda code
        run: |
          aws lambda update-function-code             --function-name brief-c-research-poc-research-processor             --zip-file fileb://lambda-package.zip             --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated-v2             --function-name brief-c-research-poc-research-processor

      - name: Verify deployment
        run: |
          aws lambda get-function-configuration             --function-name brief-c-research-poc-research-processor             --query '{FunctionName:FunctionName,Version:Version,State:State,LastUpdateStatus:LastUpdateStatus,CodeSha256:CodeSha256}'             --output json
